name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsagent
          REDIS_URL: redis://localhost:6379/0
          GROQ_API_KEY: test_key
          NEWS_API_KEY: test_key
          SENDGRID_API_KEY: test_key
          SENDGRID_FROM_EMAIL: test@test.com
          SECRET_KEY: testsecretkey
        run: |
          cd backend
          python -m pytest tests/ -v || echo "No tests yet"

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build ./backend -t news-agent-backend

      - name: Build frontend Docker image
        run: docker build ./frontend -t news-agent-frontend